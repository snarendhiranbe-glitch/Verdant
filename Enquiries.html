<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdant - Enquiries</title>
  <link rel="stylesheet" href="verdant-pages.css">
  <style>
    :root{--green:#167a4a;--green-dark:#0d5c37;--text:#153126}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text)}
    header{position:fixed;z-index:20;top:0;width:100%;height:96px;padding:0 max(24px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);border-bottom:1px solid #e2ece6}
    .brand{display:inline-flex;align-items:center;gap:11px;color:var(--green-dark);text-decoration:none}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--green);color:#fff}.brand-name{font-size:27px;font-weight:750}
    nav{display:flex;gap:34px}nav a{color:#51635a;text-decoration:none;font-weight:650}nav a.login{padding:12px 22px;border:1px solid var(--green);border-radius:999px;color:var(--green)}
    main{width:min(1180px,calc(100% - 48px));margin:0 auto;padding:145px 0 70px}
    h1{font-size:56px;letter-spacing:-3px}h1 span{color:var(--green)}
    .toolbar{display:flex;justify-content:flex-end;margin:24px 0}.clear-button{height:42px;border:1px solid #d7e5dd;border-radius:9px;padding:0 16px;background:#fff;color:#7a4747;font:inherit;font-weight:750;cursor:pointer}
    .empty{margin-top:30px;padding:36px;border:1px solid #dce9e1;border-radius:18px;background:rgba(255,255,255,.88);color:#66776e}
    .enquiry-list{display:grid;gap:14px;margin-top:20px}.enquiry-row{display:grid;grid-template-columns:1.4fr 1fr 1.4fr 1fr 166px;gap:16px;align-items:center;padding:20px;border:1px solid #dce9e1;border-radius:16px;background:rgba(255,255,255,.92)}
    .enquiry-row strong{display:block;font-size:15px}.enquiry-row span{display:block;margin-top:5px;color:#6e7d74;font-size:13px}.row-actions{display:flex;gap:8px}.call-button,.delete-button{height:36px;border:0;border-radius:8px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.call-button{flex:1;background:var(--green);color:#fff;text-decoration:none;display:grid;place-items:center}.delete-button{width:64px;background:#edf7f1;color:#7a4747}
    @media(max-width:760px){header{height:82px;padding:0 16px}.brand-name{font-size:24px}nav{display:none}main{width:min(100% - 32px,1180px);padding-top:112px}h1{font-size:42px}.enquiry-row{grid-template-columns:1fr}.toolbar{justify-content:flex-start}}
  </style>
</head>
<body>
  <script>
    if (sessionStorage.getItem("verdantAdminSession") !== "active") {
      window.location.replace("Login.html");
    }
  </script>
  <header>
    <a class="brand" href="Home.html"><span class="brand-mark">V</span><span class="brand-name">Verdant</span></a>
    <nav><a href="Home.html">Home</a><a href="Services.html">Services</a><a href="Support.html">Customer Support</a><a class="login" href="Login.html">Login</a></nav>
  </header>
  <main>
    <h1>Saved <span>enquiries</span></h1>
    <div class="toolbar"><button class="clear-button" id="clear-enquiries" type="button">Clear all</button></div>
    <div id="enquiry-list" class="enquiry-list"></div>
  </main>
  <script>
    const list = document.querySelector("#enquiry-list");
    const clearButton = document.querySelector("#clear-enquiries");

    function renderEnquiries() {
      const enquiries = JSON.parse(localStorage.getItem("verdantEnquiries") || "[]");
      list.innerHTML = "";

      if (!enquiries.length) {
        list.innerHTML = '<div class="empty">No enquiries have been submitted in this browser yet.</div>';
        clearButton.disabled = true;
        return;
      }

      clearButton.disabled = false;
      enquiries.forEach((entry) => {
        const row = document.createElement("article");
        row.className = "enquiry-row";
        row.innerHTML = `
          <div><strong>Email</strong><span></span></div>
          <div><strong>Phone</strong><span></span></div>
          <div><strong>Address</strong><span></span></div>
          <div><strong>State / Country</strong><span></span></div>
          <div class="row-actions">
            <a class="call-button" href="#" role="button">Call</a>
            <button class="delete-button" type="button">Delete</button>
          </div>
        `;
        const values = row.querySelectorAll("span");
        values[0].textContent = entry.email;
        values[1].textContent = `${entry.phoneCode} ${entry.phone}`;
        values[2].textContent = entry.address;
        values[3].textContent = `${entry.state}, ${entry.country}`;
        const digitsOnly = `${entry.phoneCode}${entry.phone}`.replace(/[^\d+]/g, "");
        row.querySelector(".call-button").href = `tel:${digitsOnly}`;
        row.querySelector(".delete-button").addEventListener("click", () => {
          const updated = JSON.parse(localStorage.getItem("verdantEnquiries") || "[]")
            .filter((item) => item.id !== entry.id);
          localStorage.setItem("verdantEnquiries", JSON.stringify(updated));
          renderEnquiries();
        });
        list.appendChild(row);
      });
    }

    clearButton.addEventListener("click", () => {
      localStorage.removeItem("verdantEnquiries");
      renderEnquiries();
    });

    renderEnquiries();
  </script>
</body>
</html>
