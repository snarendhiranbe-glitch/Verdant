<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verdant - Sustainability</title>
  <style>
    :root{--green:#167a4a;--text:#153126}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:#eef6f1}header{position:fixed;z-index:20;top:0;width:100%;height:96px;padding:0 max(24px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);border-bottom:1px solid #e2ece6} .brand{display:inline-flex;align-items:center;gap:11px;color:#0d5c37;text-decoration:none}.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--green)}.brand-name{font-size:27px;font-weight:750}nav{display:flex;gap:34px}nav a{color:#51635a;text-decoration:none;font-weight:650}nav a.login{padding:12px 22px;border:1px solid var(--green);border-radius:999px;color:var(--green)}
    main{min-height:100vh;padding:155px 24px 80px;display:grid;place-items:center}.detail{position:relative;width:min(1180px,100%);min-height:560px;padding:58px;overflow:hidden;border-radius:32px;background:linear-gradient(135deg,#fff,#dfeee5)}.leaf{position:absolute;right:50px;bottom:-50px;width:330px;height:330px;border-radius:85% 10% 85% 10%;background:linear-gradient(135deg,#60b580,#167a4a);transform:rotate(-18deg);animation:breathe 5s ease-in-out infinite}.leaf:after{content:"";position:absolute;width:5px;height:260px;left:50%;top:35px;background:rgba(255,255,255,.55);transform:rotate(38deg);border-radius:5px}.kicker{color:var(--green);font-size:13px;font-weight:800;text-transform:uppercase}.detail h1{position:relative;z-index:2;max-width:680px;margin-top:14px;font-size:68px;line-height:1;letter-spacing:-4px}.detail h1 span{color:var(--green)}.detail p{position:relative;z-index:2;max-width:540px;margin-top:22px;color:#617269;font-size:18px;line-height:1.7}.goals{position:absolute;z-index:3;left:58px;bottom:58px;display:flex;gap:12px}.goal{padding:16px 20px;border:1px solid #d2e3d8;border-radius:14px;background:rgba(255,255,255,.88)}.goal strong{display:block;color:var(--green);font-size:24px}@keyframes breathe{50%{transform:rotate(-12deg) scale(1.04)}}@media(max-width:760px){header{height:82px;padding:0 16px}.brand-name{font-size:24px}nav{display:none}main{padding:112px 16px 50px}.detail{min-height:650px;padding:28px}.detail h1{font-size:44px}.leaf{width:220px;height:220px;right:-40px}.goals{left:28px;right:28px;bottom:28px;flex-direction:column}.goal{padding:10px 14px}}
  </style>
  <link rel="stylesheet" href="verdant-pages.css">
</head>
<body>
  <header><a class="brand" href="Home.html"><span class="brand-mark"></span><span class="brand-name">Verdant</span></a><nav><a href="Home.html">Home</a><a href="Services.html">Services</a><a href="Support.html">Customer Support</a><a class="login" href="Login.html">Login</a></nav></header>
  <main><section class="detail"><div class="leaf"></div><span class="kicker">Sustainability</span><h1>Growth that protects <span>what matters.</span></h1><p>Verdant supports responsible investing with practical ESG research, transparent standards, and strategies focused on lasting environmental and social value.</p><div class="goals"><div class="goal"><strong>70%</strong><span>Responsible funds</span></div><div class="goal"><strong>Net zero</strong><span>2035 ambition</span></div></div></section></main>
  <script src="verdant-app.js"></script>
</body>
</html>
