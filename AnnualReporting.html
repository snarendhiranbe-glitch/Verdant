<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verdant - Annual Reporting</title>
  <style>
    :root{--green:#167a4a;--text:#153126}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:#f7faf8}header{position:fixed;z-index:20;top:0;width:100%;height:96px;padding:0 max(24px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);border-bottom:1px solid #e2ece6}.brand{display:inline-flex;align-items:center;gap:11px;color:#0d5c37;text-decoration:none}.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--green)}.brand-name{font-size:27px;font-weight:750}nav{display:flex;gap:34px}nav a{color:#51635a;text-decoration:none;font-weight:650}nav a.login{padding:12px 22px;border:1px solid var(--green);border-radius:999px;color:var(--green)}
    main{min-height:100vh;padding:155px 24px 80px;display:grid;place-items:center}.detail{position:relative;width:min(1180px,100%);min-height:560px;padding:58px;overflow:hidden;border-radius:32px;background:linear-gradient(135deg,#102619,#173929);color:#fff}.detail:before{content:"";position:absolute;width:420px;height:420px;right:-180px;top:-180px;border:55px solid rgba(134,202,162,.08);border-radius:50%;animation:pulse 4s ease-in-out infinite}.kicker{color:#86caa2;font-size:13px;font-weight:800;text-transform:uppercase}.detail h1{max-width:720px;margin-top:14px;font-size:68px;line-height:1;letter-spacing:-4px}.detail h1 span{color:#86caa2}.detail p{max-width:600px;margin-top:22px;color:#bdd0c4;font-size:18px;line-height:1.7}.report{position:absolute;right:58px;bottom:58px;width:310px;padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.07);animation:lift 4s ease-in-out infinite}.report strong{display:block;font-size:38px;color:#86caa2}.report span{display:block;margin:8px 0 18px;color:#d2ded6}.download{display:inline-flex;padding:12px 16px;border-radius:9px;background:#86caa2;color:#102619;text-decoration:none;font-weight:800}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes lift{50%{transform:translateY(-12px)}}@media(max-width:760px){header{height:82px;padding:0 16px}.brand-name{font-size:24px}nav{display:none}main{padding:112px 16px 50px}.detail{min-height:650px;padding:28px}.detail h1{font-size:44px}.report{left:28px;right:28px;bottom:28px;width:auto;padding:20px}.report strong{font-size:30px}}
  </style>
  <link rel="stylesheet" href="verdant-pages.css">
</head>
<body>
  <header><a class="brand" href="Home.html"><span class="brand-mark"></span><span class="brand-name">Verdant</span></a><nav><a href="Home.html">Home</a><a href="Services.html">Services</a><a href="Support.html">Customer Support</a><a class="login" href="Login.html">Login</a></nav></header>
  <main><section class="detail"><span class="kicker">Annual Reporting</span><h1>Results explained with <span>full clarity.</span></h1><p>Review Verdant's annual performance, governance, market outlook, responsible investment priorities, and future financial plans.</p><div class="report"><strong>2025</strong><span>Annual report &amp; financial statements</span><a class="download" href="#">View report →</a></div></section></main>
  <script src="verdant-app.js"></script>
</body>
</html>
