<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verdant - Corporate Calendar</title>
  <style>
    :root{--green:#167a4a;--text:#153126}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:#f7faf8}header{position:fixed;z-index:20;top:0;width:100%;height:96px;padding:0 max(24px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);border-bottom:1px solid #e2ece6}.brand{display:inline-flex;align-items:center;gap:11px;color:#0d5c37;text-decoration:none}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--green)}.brand-name{font-size:27px;font-weight:750}nav{display:flex;gap:34px}nav a{color:#51635a;text-decoration:none;font-weight:650}nav a.login{padding:12px 22px;border:1px solid var(--green);border-radius:999px;color:var(--green)}
    main{min-height:100vh;padding:155px 24px 80px;display:grid;place-items:center}.detail{position:relative;width:min(1180px,100%);min-height:560px;padding:58px;overflow:hidden;border-radius:32px;background:#102619;color:#fff}.detail:after{content:"";position:absolute;width:420px;height:420px;right:-100px;bottom:-210px;border:70px solid rgba(134,202,162,.12);border-radius:50%;animation:orbit 12s linear infinite}.kicker{color:#86caa2;font-size:13px;font-weight:800;text-transform:uppercase}.detail h1{max-width:720px;margin-top:14px;font-size:68px;line-height:1;letter-spacing:-4px}.detail h1 span{color:#86caa2}.detail p{max-width:600px;margin-top:22px;color:#bdd0c4;font-size:18px;line-height:1.7}.events{position:absolute;left:58px;right:58px;bottom:58px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.event{padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.05)}.event strong{display:block;color:#86caa2;font-size:20px}.event span{display:block;margin-top:6px;color:#d2ded6;font-size:13px}@keyframes orbit{to{transform:rotate(360deg)}}@media(max-width:760px){header{height:82px;padding:0 16px}.brand-name{font-size:24px}nav{display:none}main{padding:112px 16px 50px}.detail{min-height:650px;padding:28px}.detail h1{font-size:44px}.events{left:28px;right:28px;bottom:28px;grid-template-columns:1fr}.event{padding:12px}}
  </style>
  <link rel="stylesheet" href="verdant-pages.css">
</head>
<body>
  <header><a class="brand" href="Home.html"><span class="brand-mark"></span><span class="brand-name">Verdant</span></a><nav><a href="Home.html">Home</a><a href="Services.html">Services</a><a href="Support.html">Customer Support</a><a class="login" href="Login.html">Login</a></nav></header>
  <main><section class="detail"><span class="kicker">Corporate Calendar</span><h1>Stay ahead of <span>key milestones.</span></h1><p>Follow investor calls, earnings releases, annual meetings, and important Verdant announcements in one clear schedule.</p><div class="events"><div class="event"><strong>18 DEC</strong><span>Annual investor call</span></div><div class="event"><strong>08 JAN</strong><span>Quarterly results</span></div><div class="event"><strong>24 FEB</strong><span>Shareholder meeting</span></div></div></section></main>
  <script src="verdant-app.js"></script>
</body>
</html>
