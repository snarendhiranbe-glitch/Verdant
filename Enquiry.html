<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdant - Enquiry</title>
  <style>
    :root {
      --green: #167a4a;
      --green-dark: #0d5c37;
      --green-soft: #eaf7ef;
      --text: #153126;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #f8fcf9 0%, #eef7f1 100%);
    }

    .background-shape {
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      background: rgba(111, 183, 139, 0.14);
      animation: float 9s ease-in-out infinite;
    }

    .shape-one { width: 280px; height: 280px; right: -90px; top: 110px; }
    .shape-two { width: 190px; height: 190px; left: -70px; bottom: 70px; animation-delay: -4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-18px) scale(1.05); }
    }

    header {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      width: 100%;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(24px, calc((100% - 1180px) / 2));
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid #e2ece6;
      backdrop-filter: blur(16px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--green-dark);
      text-decoration: none;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--green);
    }

    .brand-mark svg { width: 27px; height: 27px; }
    .brand-name { font-size: 27px; font-weight: 750; letter-spacing: -1px; }

    nav { display: flex; align-items: center; gap: 34px; }
    nav a { color: #51635a; text-decoration: none; font-size: 15px; font-weight: 650; }
    nav a.login { padding: 12px 22px; border: 1px solid var(--green); border-radius: 999px; color: var(--green); }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 0.78fr 1.22fr;
      align-items: center;
      gap: 64px;
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 140px 0 70px;
    }

    .enquiry-copy h1 {
      font-size: clamp(48px, 6vw, 72px);
      line-height: 0.98;
      letter-spacing: -4px;
    }

    .enquiry-copy h1 span { color: var(--green); }

    .enquiry-copy p {
      max-width: 480px;
      margin-top: 22px;
      color: #617269;
      font-size: 17px;
      line-height: 1.7;
    }

    .enquiry-card {
      padding: 38px;
      border: 1px solid #dbe8e0;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 70px rgba(47, 112, 75, 0.12);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .field { display: flex; flex-direction: column; gap: 8px; }
    .field.full { grid-column: 1 / -1; }

    label {
      color: #51635a;
      font-size: 13px;
      font-weight: 800;
    }

    input, select {
      width: 100%;
      height: 50px;
      border: 1px solid #d7e5dd;
      border-radius: 10px;
      outline: none;
      padding: 0 14px;
      background: #ffffff;
      color: var(--text);
      font: inherit;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    input:focus, select:focus {
      border-color: #73ad8b;
      box-shadow: 0 0 0 4px rgba(22, 122, 74, 0.08);
    }

    select {
      appearance: auto;
      cursor: pointer;
    }

    .phone-group {
      display: grid;
      grid-template-columns: 145px 1fr;
      gap: 10px;
    }

    .phone-code {
      min-width: 145px;
      padding: 0 10px;
      font-size: 14px;
    }

    .submit-button {
      width: auto;
      min-width: 160px;
      height: 48px;
      display: block;
      margin: 22px auto 0;
      border: 0;
      border-radius: 11px;
      background: var(--green);
      color: var(--white);
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    .submit-button:hover { background: var(--green-dark); transform: translateY(-2px); }
    .form-status { min-height: 18px; margin-top: 10px; color: var(--green); font-size: 13px; font-weight: 700; text-align: center; }

    @media (max-width: 760px) {
      header { height: 82px; padding: 0 16px; }
      .brand-name { font-size: 24px; }
      nav { display: none; }
      main { width: min(100% - 32px, 1180px); grid-template-columns: 1fr; gap: 32px; padding: 118px 0 50px; }
      .enquiry-copy { text-align: center; }
      .enquiry-copy h1 { font-size: 46px; letter-spacing: -3px; }
      .enquiry-copy p { margin-inline: auto; font-size: 15px; }
      .enquiry-card { padding: 24px 18px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .phone-group { grid-template-columns: 128px 1fr; }
      .phone-code { min-width: 128px; padding: 0 6px; }
      .submit-button { width: 100%; min-width: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .background-shape { animation: none; }
    }
  </style>
